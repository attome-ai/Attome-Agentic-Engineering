name: attome-ae
channels:
  - conda-forge
dependencies:
  - python=3.12
  # CAD
  - cadquery
  - build123d
  # meshing and solving (gmsh and calculix are GPL: run as subprocesses only, see docs/licences.md)
  - gmsh
  - calculix
  - meshio
  - scikit-fem
  # numerics and data
  - numpy
  - scipy
  - pydantic
  # optimization
  - imageio
  - imageio-ffmpeg  # MP4 export of scenes; ffmpeg runs as a separate program
  - optuna >=5,<7  # constraints_func removed in 7 (docs/environment.md)
  - pymoo
  - ax-platform
  - botorch
  - salib
  # results and visualization export
  - pyvista
  # tests
  - pytest
  # C++ engine build (MSVC from Visual Studio 2022 on Windows)
  - ninja
  - nlohmann_json
  - doctest
  - eigen
