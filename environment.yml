name: attome-ae
channels:
  - conda-forge
dependencies:
  - python=3.12
  # CAD
  - cadquery
  - build123d
  # meshing and solving (gmsh and calculix are GPL: run as subprocesses only, see docs/licences.md)
  - gmsh
  - calculix
  - meshio
  - scikit-fem
  # numerics and data
  - numpy
  - scipy
  - pydantic
  # optimization
  - optuna >=5,<7  # constraints_func removed in 7 (docs/environment.md)
  - pymoo
  - ax-platform
  - botorch
  - salib
  # results and visualization export
  - pyvista
  - imageio
  - imageio-ffmpeg  # MP4 export of scenes; ffmpeg runs as a separate program
  # agent server (MCP)
  - mcp =2.3
  # tests
  - pytest
  # C++ engine build (MSVC and CMake from Visual Studio 2022 on Windows, set up by scripts/build_engine.cmd)
  - occt =7.8.1  # OpenCASCADE: LGPL-2.1 with exception, linked dynamically
  - ninja
  - nlohmann_json
  - doctest
  - eigen
