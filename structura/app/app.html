<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attome AE Workbench</title>
<style>
:root{--bg:#f6f6f3;--panel:#ffffff;--ink:#1c1c1a;--muted:#66665f;--line:#deddd6;--accent:#2f6f5e;--accent-soft:#e2eee9;
--warn:#a2531b;--warn-soft:#f6e7da;--bad:#a8323a;--bad-soft:#f6dfe0;--good:#2f7d4f;--good-soft:#e0efe5;--chip:#efeee8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151614;--panel:#1e201d;--ink:#ecebe6;--muted:#a3a29a;--line:#363833;
--accent:#6fb59f;--accent-soft:#22332d;--warn:#e0a166;--warn-soft:#3a2c1f;--bad:#e2777d;--bad-soft:#3a2224;--good:#7cc497;--good-soft:#1f3326;--chip:#2a2c28}}
:root[data-theme="dark"]{--bg:#151614;--panel:#1e201d;--ink:#ecebe6;--muted:#a3a29a;--line:#363833;--accent:#6fb59f;--accent-soft:#22332d;
--warn:#e0a166;--warn-soft:#3a2c1f;--bad:#e2777d;--bad-soft:#3a2224;--good:#7cc497;--good-soft:#1f3326;--chip:#2a2c28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:.2rem 0}h2{font-size:1.1rem;margin:0 0 .6rem}h3{font-size:.95rem;margin:.8rem 0 .4rem}
.eyebrow{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin:0}
.dek{color:var(--muted);margin:.3rem 0 1rem;max-width:80ch}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:120px}
.stat b{font-size:1.25rem}.stat span{color:var(--muted);font-size:.8rem}
#viewer{position:relative;height:460px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
#viewer canvas{display:block;width:100%;height:100%;touch-action:none}
#probe{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.8rem;pointer-events:none}
#legend{position:absolute;right:10px;top:10px;bottom:10px;width:70px;display:flex;flex-direction:column;align-items:flex-end;font-size:.75rem}
#legend .bar{flex:1;width:14px;border-radius:3px;margin:4px 0}
#splitlabels{position:absolute;top:44px;left:0;right:0;display:flex;pointer-events:none}#splitlabels span{flex:1;text-align:center;font-size:.78rem;font-weight:600;color:var(--muted)}#splitlabels span+span{border-left:1px dashed var(--line)}
#viewname{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.8rem}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0;font-size:.85rem}
.seg button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;cursor:pointer;font:inherit}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
svg text{fill:var(--muted);font-size:11px}
.pt{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblw{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:600}
.pass{background:var(--good-soft);color:var(--good)}.fail{background:var(--bad-soft);color:var(--bad)}.np{background:var(--warn-soft);color:var(--warn)}
.grade{font-size:2.2rem;font-weight:700;line-height:1;padding:6px 14px;border-radius:10px}
.gA{background:var(--good-soft);color:var(--good)}.gB{background:var(--warn-soft);color:var(--warn)}.gC{background:var(--bad-soft);color:var(--bad)}
ul.plain{margin:.2rem 0;padding-left:1.1rem}ul.plain li{margin:.15rem 0}
.tl{list-style:none;margin:0;padding:0;font-size:.85rem}.tl li{display:grid;grid-template-columns:64px 110px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.muted{color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;margin-top:20px}
.wb{display:grid;grid-template-columns:320px 1fr;gap:14px}@media (max-width:800px){.wb{grid-template-columns:1fr}}
.prm{display:block;margin:8px 0;font-size:.85rem}.prm input{width:100%}.prm b{float:right}.prm span{font-size:.72rem}
</style>
</head>
<body>
<main style="max-width:1300px;margin:0 auto;padding:18px 16px 40px">
  <div class="muted" style="font-size:.78rem;letter-spacing:.06em">ATTOME AGENTIC ENGINEERING · WORKBENCH · REAL ENGINE, NO AI IN THE LOOP</div>
  <h1 style="margin:.2rem 0 .8rem;font-size:1.4rem">Evaluate a design by hand</h1>
  <div class="wb">
    <section class="card">
      <h2>Brief</h2>
      <select id="spec" style="width:100%;padding:6px;font:inherit"></select>
      <p class="muted" id="brief" style="font-size:.85rem"></p>
      <h3>Parameters</h3>
      <div id="params"></div>
      <label style="display:block;margin-top:10px;font-size:.85rem">Mesh size (mm)
        <select id="mesh" style="font:inherit"><option>6</option><option selected>4</option><option>3</option></select></label>
      <label style="display:block;margin-top:6px;font-size:.85rem"><input type="checkbox" id="auto"> evaluate when a slider is released</label>
      <button id="go" style="margin-top:12px;width:100%;padding:9px;font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer">Evaluate</button>
      <p class="muted" id="status" style="font-size:.85rem;min-height:1.2em"></p>
    </section>
    <section class="card">
      <div class="controls">
        <div class="seg" id="fieldseg"><button data-f="vm" aria-pressed="true">Von Mises</button><button data-f="disp" aria-pressed="false">Displacement</button><button data-f="safety" aria-pressed="false">Safety</button></div>
        <label><input type="checkbox" id="marks" checked> loads &amp; supports</label>
      </div>
      <div id="viewer"><canvas id="cv"></canvas><div id="probe">press Evaluate</div><div id="legend"></div></div>
      <div class="tblw" style="margin-top:10px"><table id="res"></table></div>
    </section>
  </div>
</main>
<script>__THREE__</script>
<script>
const $ = q => document.querySelector(q);
const f3 = v => v == null || !isFinite(v) ? "–" : (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const b64f = s => {const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Float32Array(u.buffer)};
const b64u = s => {const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Uint32Array(u.buffer)};
let SPECS = [], spec = null, field = "vm", last = null;
const NAMES = {mass_g: "Mass", safety_factor: "Safety factor", max_disp_mm: "Max displacement", max_von_mises_MPa: "Peak von Mises (evaluation region)", peak_temperature: "Peak temperature", cost: "Manufacturing cost"};

// ---------------------------------------------------------------- viewer
const cv = $("#cv"), box = $("#viewer");
const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(1, -1.5, 2); scene.add(sun);
let mesh = null, marks = null, K = null, target = new THREE.Vector3(), radius = 300, theta = -0.9, phi = 1.05, keepView = false;
function resize(){const w = box.clientWidth, h = box.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); draw()}
function draw(){camera.position.set(target.x + radius*Math.sin(phi)*Math.cos(theta), target.y + radius*Math.sin(phi)*Math.sin(theta), target.z + radius*Math.cos(phi));
  camera.up.set(0, 0, 1); camera.lookAt(target); renderer.render(scene, camera)}
let drag = null;
cv.addEventListener("pointerdown", e => {drag = {x: e.clientX, y: e.clientY, pan: e.shiftKey}; cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointerup", () => drag = null);
cv.addEventListener("pointermove", e => {
  if (drag) {const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {const s = radius/400, right = new THREE.Vector3().subVectors(camera.position, target).cross(camera.up).normalize(); target.addScaledVector(right, dx*s); target.z += dy*s}
    else {theta -= dx*0.008; phi = Math.min(3.1, Math.max(0.05, phi - dy*0.008))} draw(); return}
  probe(e)});
cv.addEventListener("wheel", e => {e.preventDefault(); radius *= Math.exp(e.deltaY*0.001); draw()}, {passive: false});
new ResizeObserver(resize).observe(box);
const VIR = [[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[109,205,89],[180,222,44],[253,231,37]];
function viridis(t){t = Math.min(1, Math.max(0, t)); const x = t*(VIR.length-1), i = Math.floor(x), f = x - i, a = VIR[i], b = VIR[Math.min(i+1, VIR.length-1)];
  return [(a[0]+(b[0]-a[0])*f)/255, (a[1]+(b[1]-a[1])*f)/255, (a[2]+(b[2]-a[2])*f)/255]}

function showSkin(skin){
  const sc = skin.scalar ? skin[skin.scalar.name] : skin.von_mises;
  K = {skin, pos: b64f(skin.positions), disp: b64f(skin.disp), vm: b64f(sc), idx: b64u(skin.indices)};
  if (mesh) {scene.remove(mesh); mesh.geometry.dispose()}
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(K.pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(K.pos.length), 3));
  g.setIndex(new THREE.BufferAttribute(K.idx, 1)); g.computeVertexNormals(); g.computeBoundingSphere();
  mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors: true, side: THREE.DoubleSide})); scene.add(mesh);
  if (!keepView) {target.copy(g.boundingSphere.center); radius = g.boundingSphere.radius * 3.2; keepView = true}
  $("#fieldseg").style.display = skin.scalar ? "none" : "";
  drawMarkers(skin, g.boundingSphere); colorize(); resize();
}
function drawMarkers(skin, sph){
  if (marks) scene.remove(marks);
  marks = new THREE.Group(); marks.visible = $("#marks").checked;
  const L = 0.35*sph.radius;
  for (const m of skin.markers || []) {
    const at = new THREE.Vector3(...m.at), b = m.bbox;
    if (m.kind === "support") {
      const fixed = (m.dofs || "123") === "123", geo = new THREE.BoxGeometry(b[3]-b[0]+1.2, b[4]-b[1]+1.2, b[5]-b[2]+1.2);
      const bx = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: fixed ? 0x1c7ed6 : 0x74c0fc, transparent: true, opacity: fixed ? 0.35 : 0.22, depthWrite: false}));
      bx.position.set((b[0]+b[3])/2, (b[1]+b[4])/2, (b[2]+b[5])/2); marks.add(bx);
    } else {
      let dir;
      if (m.force && Math.hypot(...m.force) > 0) dir = new THREE.Vector3(...m.force).normalize();
      else {const ext = [b[3]-b[0], b[4]-b[1], b[5]-b[2]], ax = ext.indexOf(Math.min(...ext)); dir = new THREE.Vector3(); dir.setComponent(ax, Math.sign(sph.center.getComponent(ax) - at.getComponent(ax)) || 1)}
      marks.add(new THREE.ArrowHelper(dir, at.clone().addScaledVector(dir, -L), L, m.kind === "load" ? 0xd9480f : 0xc2255c, 0.28*L, 0.14*L));
    }
  }
  scene.add(marks);
}
function colorize(){
  if (!mesh) return;
  const s = K.skin, c = mesh.geometry.attributes.color.array, n = K.vm.length;
  const req = (spec.requirements.find(r => r.quantity === "safety_factor" && r.op === ">=") || {value: 2}).value, yld = s.yield_MPa || 1;
  let lo = 0, hi = 1, unit = "MPa", name = "Von Mises";
  if (s.scalar) {lo = s.scalar.min; hi = s.scalar.max; unit = s.scalar.unit; name = s.scalar.name}
  else if (field === "vm") hi = s.max_von_mises_MPa || 1;
  else if (field === "disp") {hi = s.max_disp_mm || 1; unit = "mm"; name = "Displacement"}
  for (let i = 0; i < n; i++) {
    let rgb;
    if (s.scalar || field === "vm") rgb = viridis((K.vm[i] - lo)/(hi - lo || 1));
    else if (field === "disp") rgb = viridis(Math.hypot(K.disp[3*i], K.disp[3*i+1], K.disp[3*i+2]) / hi);
    else {const sf = K.vm[i] > 0 ? yld / K.vm[i] : 1e9; rgb = sf >= req*1.1 ? [0.19,0.55,0.33] : sf >= req ? [0.85,0.6,0.2] : [0.75,0.2,0.24]}
    c[3*i] = rgb[0]; c[3*i+1] = rgb[1]; c[3*i+2] = rgb[2];
  }
  mesh.geometry.attributes.color.needsUpdate = true;
  const stops = VIR.map((v, i) => `rgb(${VIR[VIR.length-1-i].join(",")}) ${(100*i/(VIR.length-1)).toFixed(0)}%`).join(",");
  $("#legend").innerHTML = field === "safety" && !s.scalar ? `<div>SF</div><div class="bar" style="background:linear-gradient(#2f8c54 0 45%,#d99a33 45% 60%,#bf333d 60% 100%)"></div><div>&lt; ${req}</div>`
    : `<div>${f3(hi)} ${unit}</div><div class="bar" style="background:linear-gradient(${stops})"></div><div>${f3(lo)}</div><div class="muted">${esc(name)}</div>`;
  draw();
}
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function probe(e){
  if (!mesh) return;
  const r = cv.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse, camera); const hit = ray.intersectObject(mesh)[0];
  if (!hit) {$("#probe").textContent = "hover the part to read values"; return}
  const i = hit.face.a, s = K.skin;
  $("#probe").textContent = s.scalar ? `${s.scalar.name} ${f3(K.vm[i])} ${s.scalar.unit}` :
    `von Mises ${f3(K.vm[i])} MPa · displacement ${f3(Math.hypot(K.disp[3*i], K.disp[3*i+1], K.disp[3*i+2]))} mm`;
}
$("#fieldseg").addEventListener("click", e => {const b = e.target.closest("button"); if (!b) return; field = b.dataset.f;
  $("#fieldseg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); colorize()});
$("#marks").addEventListener("change", e => {if (marks) {marks.visible = e.target.checked; draw()}});

// ---------------------------------------------------------------- brief, sliders, evaluation
function pickSpec(){
  spec = SPECS.find(s => s.file === $("#spec").value); keepView = false;
  $("#brief").textContent = spec.brief;
  $("#params").innerHTML = Object.entries(spec.free).map(([k, [lo, hi]]) => {
    const int = Number.isInteger(lo) && Number.isInteger(hi) && /count/.test(k), step = int ? 1 : (hi - lo)/200, mid = int ? Math.round((lo+hi)/2) : (lo+hi)/2;
    return `<label class="prm">${esc(k.replace(/_/g, " "))} <b id="v_${k}">${int ? mid : f3(mid)}</b><input type="range" data-int="${int ? 1 : 0}" data-k="${k}" min="${lo}" max="${hi}" step="${step}" value="${mid}"><span class="muted">${f3(lo)} – ${f3(hi)}</span></label>`}).join("");
  $("#params").querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => $("#v_" + inp.dataset.k).textContent = inp.dataset.int === "1" ? inp.value : f3(+inp.value));
    inp.addEventListener("change", () => {if ($("#auto").checked) run()})});
  $("#res").innerHTML = ""; $("#status").textContent = "";
}
async function run(){
  const params = {}; $("#params").querySelectorAll("input").forEach(i => params[i.dataset.k] = +i.value);
  $("#go").disabled = true; $("#status").textContent = "building, meshing and solving…"; const t0 = performance.now();
  try {
    const r = await (await fetch("/api/evaluate", {method: "POST", body: JSON.stringify({file: spec.file, params, mesh: +$("#mesh").value})})).json();
    const dt = ((performance.now() - t0)/1000).toFixed(1);
    if (r.status !== "ok") {
      const why = r.gate && r.gate.gate_after ? (r.gate.gate_after.reasons || []).join("; ") : (r.error || r.status);
      $("#status").textContent = `${r.status} after ${dt} s: ${why}`; $("#res").innerHTML = ""; return}
    $("#status").textContent = `${r.feasible ? "meets every requirement" : "does NOT meet every requirement"} · ${dt} s · real CalculiX solve`;
    const m = r.metrics, units = {mass_g: "g", safety_factor: "", max_disp_mm: "mm", max_von_mises_MPa: "MPa", peak_temperature: "degC", cost: "USD"};
    let h = `<tr><th>Result</th><th class="n">Value</th></tr>` + Object.keys(units).filter(k => m[k] != null).map(k => `<tr><td>${esc(NAMES[k] || k)}</td><td class="n">${f3(m[k])} ${units[k]}</td></tr>`).join("");
    h += `<tr><th>Requirement</th><th class="n">Value · limit</th></tr>` + (r.checks || []).map(c =>
      `<tr><td>${esc(c.id)} ${esc(NAMES[c.quantity] || c.quantity)}</td><td class="n">${f3(c.value)} ${esc(c.op)} ${f3(c.limit)} <span class="pill ${c.passed ? "pass" : "fail"}">${c.passed ? "pass" : "fail"}</span></td></tr>`).join("");
    $("#res").innerHTML = h;
    if (r.skin) showSkin(r.skin);
  } catch (e) {$("#status").textContent = "request failed: " + e}
  finally {$("#go").disabled = false}
}
$("#go").addEventListener("click", run);
$("#spec").addEventListener("change", pickSpec);
fetch("/api/specs").then(r => r.json()).then(s => {SPECS = s;
  $("#spec").innerHTML = s.map(x => `<option value="${esc(x.file)}">${esc(x.id)} (${esc(x.family)})</option>`).join("");
  const want = s.find(x => x.file === "bracket_20kg.json"); if (want) $("#spec").value = want.file;
  pickSpec(); if (location.hash === "#run") run()});
</script>
</body>
</html>
